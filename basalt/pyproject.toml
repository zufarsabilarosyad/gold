[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basalt"
version = "0.1.0"
description = "Embedded Event-Driven Workflow & DAG Execution Engine"
readme = "README.md"
authors = [
    { name = "Basalt Core Team", email = "dev@basalt.local" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "fastapi>=0.111.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "aiosqlite>=0.20.0,<1.0.0",
    "click>=8.1.7,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
    "croniter>=2.0.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "python-dateutil>=2.9.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-json-report>=1.5.0,<2.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "types-pyyaml>=6.0.12,<7.0.0",
    "types-python-dateutil>=2.9.0,<3.0.0",
]

[project.scripts]
basalt = "basalt.cli.main:cli"
strata = "basalt.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--json-report",
    "--json-report-file=ctrf-report.json",
]
markers = [
    "unit: Unit test cases",
    "integration: Integration test cases",
    "api: REST API endpoint tests",
    "cli: CLI command tests",
    "slow: Tests that take longer than 1 second",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # Line length handled by formatter
    "UP042",  # Class inherits from str and Enum (StrEnum compatibility)
    "RUF012", # Mutable class attribute defaults
    "B904",   # raise ... from err within except clause
    "B905",   # zip() without explicit strict=
    "B027",   # Empty method in abstract base class
    "B039",   # ContextVar mutable default dictionary
    "B008",   # FastAPI Depends() default parameter pattern
    "F841",   # Local variable assigned but unused
    "W291",   # Trailing whitespace
    "C414",   # Unnecessary list() call within sorted()
    "C416",   # Unnecessary dict comprehension
    "C401",   # Unnecessary generator in set()
    "RUF036", # None not at end of type union
]

[tool.ruff.lint.isort]
known-first-party = ["basalt"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_redundant_casts = false
warn_unused_ignores = false
show_error_codes = true
ignore_errors = false

[[tool.mypy.overrides]]
module = ["croniter.*", "aiosqlite.*", "basalt.api.*", "basalt.cli.*", "basalt.storage.*", "basalt.core.engine.*", "basalt.core.dag.*", "basalt.core.triggers.*"]
ignore_missing_imports = true
ignore_errors = true
