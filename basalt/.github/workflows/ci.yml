name: CI - Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: ruff check src/ tests/

      - name: Run Ruff Format Check
        run: ruff format --check src/ tests/

      - name: Run Mypy Type Checking
        run: mypy src/

  test:
    name: Test Matrix (Python ${{ matrix.python-version }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Pytest Suite with Coverage & CTRF Reporting
        run: |
          pytest --cov=basalt --cov-report=xml --cov-report=term-missing tests/

      - name: Publish CTRF Test Summary
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: "ctrf-report.json"
        if: always()

      - name: Upload CTRF Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctrf-report-py${{ matrix.python-version }}
          path: ctrf-report.json
          retention-days: 14
        if: always()

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14

  package-check:
    name: Package Build & Metadata Check
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Distribution Packages (sdist & wheel)
        run: python -m build

      - name: Validate Package Metadata
        run: twine check --strict dist/*

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-packages
          path: dist/
          retention-days: 7

  docker-smoke-test:
    name: Docker Container Build & Smoke Test
    needs: [test, package-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: basalt:test

      - name: Run Docker Container
        run: |
          docker run -d --name basalt_server -p 8000:8000 basalt:test

      - name: Wait for API Server & Smoke Test Healthcheck
        run: |
          echo "Verifying Basalt API server health in container..."
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/health | grep -q "healthy"; then
              echo "✅ Basalt container health check passed successfully!"
              curl -s http://localhost:8000/info
              exit 0
            fi
            echo "Waiting for container startup (attempt $i/15)..."
            sleep 2
          done
          echo "❌ Container health check timed out!"
          docker logs basalt_server
          exit 1

      - name: Stop and Cleanup Container
        if: always()
        run: |
          docker stop basalt_server || true
          docker rm basalt_server || true
