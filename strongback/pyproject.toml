[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "strongback"
version = "0.9.0"
description = "Deterministic construction progress billing, retainage and payment applications"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = []
keywords = ["construction", "billing", "retainage", "payment application", "schedule of values"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = []

[project.scripts]
strongback = "strongback.cli.main:main"

[tool.setuptools.packages.find]
include = ["strongback*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
